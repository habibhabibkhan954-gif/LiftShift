name: Import Exercises Dataset

on:
  workflow_dispatch:          # run manually from the Actions tab
  push:
    branches: [ main ]        # optional automatic run

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 1️⃣ Checkout the LiftShift repo (no credentials needed yet)
      # ------------------------------------------------------------
      - name: Checkout LiftShift
        uses: actions/checkout@v4
        with:
          persist-credentials: false   # we’ll push later with the PAT

      # ------------------------------------------------------------
      # 2️⃣ Synchronise with the remote main branch (prevents
      #    non‑fast‑forward errors)
      # ------------------------------------------------------------
      - name: Pull latest main
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git fetch origin main
          git reset --hard origin/main

      # ------------------------------------------------------------
      # 3️⃣ Clone the exercises‑dataset repo into a **sub‑folder**
      #    called `exercises-dataset` inside the root of LiftShift
      # ------------------------------------------------------------
      - name: Clone exercises‑dataset into sub‑folder
        run: |
          git clone https://github.com/habibhabibkhan954-gif/exercises-dataset.git ./exercises-dataset

      # ------------------------------------------------------------
      # 4️⃣ (Optional) Run any integration steps you need here
      # ------------------------------------------------------------
      # - name: Integrate dataset
      #   run: |
      #     # Example: copy specific files into your app folder
      #     cp -r ./exercises-dataset/data ./src/data

      # ------------------------------------------------------------
      # 5️⃣ Commit the new folder and push back to main
      # ------------------------------------------------------------
      - name: Commit changes
        run: |
          git add .
          git commit -m "Add/Update exercises‑dataset (run ${{ github.run_id }})"

      - name: Push changes (using PAT)
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.PAT_TOKEN }}   # PAT you created
          branch: main
          force: false
