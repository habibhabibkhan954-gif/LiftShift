name: Import Exercises Dataset

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout LiftShift (no credentials needed for read‑only actions)
      - name: Checkout LiftShift
        uses: actions/checkout@v4
        with:
          persist-credentials: false   # we’ll push with our own token

      # 2️⃣ Clone the exercises‑dataset repo into a temporary folder
      - name: Clone exercises‑dataset
        run: |
          git clone https://github.com/habibhabibkhan954-gif/exercises-dataset.git ./tmp_exercises

      # 3️⃣ Move its contents to the repository root
      - name: Move dataset files to root
        run: |
          shopt -s dotglob nullglob
          cp -r ./tmp_exercises/* .
          rm -rf ./tmp_exercises

      # 4️⃣ Commit the changes
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Import exercises‑dataset (run ${{ github.run_id }})"

      # 5️⃣ Push using the PAT secret
      - name: Push changes
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.PAT_TOKEN }}   # <-- PAT here
          branch: ${{ github.ref }}
          force: false
