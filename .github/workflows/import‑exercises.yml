name: Import Exercises Dataset

on:
  workflow_dispatch:          # run manually from the Actions tab
  push:
    branches: [ main ]        # optional automatic run on pushes

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the LiftShift repository (the repo where this workflow lives)
      - name: Checkout LiftShift
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 2️⃣ Clone the exercises‑dataset repo into a temporary directory
      - name: Clone exercises‑dataset into temp folder
        run: |
          git clone https://github.com/habibhabibkhan954-gif/exercises-dataset.git ./tmp_exercises

      # 3️⃣ Move the cloned contents to the repository root
      - name: Move dataset files to root
        run: |
          # Copy everything (including hidden files) from the temp folder to the repo root
          shopt -s dotglob nullglob
          cp -r ./tmp_exercises/* .
          # Clean up the temporary folder
          rm -rf ./tmp_exercises

      # 4️⃣ (Optional) Run any script that integrates the dataset into your app
      # - name: Integrate dataset
      #   run: |
      #     ./scripts/setup_exercises.sh

      # 5️⃣ Commit and push the newly added / updated files back to LiftShift
      - name: Commit and push changes
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
          force: false
